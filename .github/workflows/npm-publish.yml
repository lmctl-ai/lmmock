name: npm publish

# Publishes the release binaries of lmmock to npmjs as @lmctl-ai/lmmock (launcher) plus one
# @lmctl-ai/lmmock-OS-CPU package per platform, through npm trusted publishing (OIDC): no npm token exists
# anywhere. Triggers: a published release, a manual run for one tag, and an hourly check that publishes the latest
# release when npm does not have it yet (a release created with the workflow token starts no other workflow).
# The binaries are the ones the release already carries; this workflow only repackages them after checking
# SHA256SUMS. A version that is already on npm is skipped, so every run is safe to repeat.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default is the latest release)
        required: false
        default: ''
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: npm install -g npm@11.19.1 && npm --version
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'select(.isDraft|not) | .tagName')"; fi
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "release tag '$tag' is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          # the launcher is published last, so its presence means every platform package is already out
          if npm view "@lmctl-ai/lmmock@${version}" version >/dev/null 2>&1; then
            echo "@lmctl-ai/lmmock@${version} is already on npm; nothing to do"
            echo "todo=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # an older release published late (a manual run for an old tag) must not take the latest dist-tag
          current="$(npm view "@lmctl-ai/lmmock" dist-tags.latest 2>/dev/null || true)"
          disttag=latest
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]; then disttag=backfill; fi
          echo "todo=true" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"; echo "disttag=$disttag" >> "$GITHUB_OUTPUT"
      - name: Download and check the release assets
        if: steps.release.outputs.todo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern 'lmmock-linux-x64' --pattern 'lmmock-linux-arm64' --pattern 'lmmock-macos-x64' --pattern 'lmmock-macos-arm64' --pattern 'lmmock-windows-x64.exe' --pattern 'SHA256SUMS' --pattern 'LICENSE'
          cd assets
          sha256sum -c --ignore-missing SHA256SUMS
          # the check above skips names SHA256SUMS lacks, so require an entry for each binary we package
          for f in lmmock-linux-x64 lmmock-linux-arm64 lmmock-macos-x64 lmmock-macos-arm64 lmmock-windows-x64.exe; do grep -qE " \*?${f//./\\.}\$" SHA256SUMS || { echo "SHA256SUMS has no entry for $f" >&2; exit 1; }; done
      - name: Build the packages
        if: steps.release.outputs.todo == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          license=LICENSE; [ -f "$license" ] || license=assets/LICENSE
          node scripts/npm-packages.mjs --name lmmock --version "$VERSION" --assets assets --out out --license "$license" \
            --repo "$GITHUB_REPOSITORY" --description "Scriptable loopback HTTP mocks for integration tests, powered by Go and lmcode" --target linux-x64=lmmock-linux-x64 --target linux-arm64=lmmock-linux-arm64 --target darwin-x64=lmmock-macos-x64 --target darwin-arm64=lmmock-macos-arm64 --target windows-x64=lmmock-windows-x64.exe | tee order.jsonl
      - name: Publish (platform packages first, launcher last)
        if: steps.release.outputs.todo == 'true'
        env:
          DIST_TAG: ${{ steps.release.outputs.disttag }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            name="$(node -p 'JSON.parse(process.argv[1]).name' "$line")"
            dir="$(node -p 'JSON.parse(process.argv[1]).dir' "$line")"
            version="$(node -p 'JSON.parse(process.argv[1]).version' "$line")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then echo "${name}@${version} already published"; continue; fi
            echo "publishing ${name}@${version}"
            npm publish "./${dir#./}" --access public --tag "$DIST_TAG"
          done < order.jsonl
      - name: Smoke test the published launcher
        if: steps.release.outputs.todo == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          sleep 20
          mkdir smoke && cd smoke && npm init -y >/dev/null
          for i in $(seq 1 30); do npm install --no-audit --no-fund "@lmctl-ai/lmmock@${VERSION}" && break || sleep 20; done
          ./node_modules/.bin/lmmock --version
